spring:
  application:
    name: gymbuddy-api
  datasource:
    # Overridden in Docker Compose with SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
    url: jdbc:postgresql://localhost:5432/gymbuddy
    username: gymbuddy
    password: gymbuddy
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  # Behind Caddy and the Cloudflare Tunnel.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

gymbuddy:
  # HMAC key for access tokens, at least 32 bytes. Set GYMBUDDY_JWT_SECRET; the app refuses to start without it.
  jwt-secret: ${GYMBUDDY_JWT_SECRET:}
  # Comma-separated origins allowed to call the API from a browser; capacitor://localhost is always added.
  cors-origins: ${GYMBUDDY_WEB_ORIGIN:http://localhost:3000}
  access-token-ttl: 15m
  refresh-token-ttl: 30d
